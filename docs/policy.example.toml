# email policy. Written by the deployer, read-only to the agent.
# Location: $EMAIL_POLICY_FILE, else ~/.config/email/policy.toml.
# A missing file means mode = "read". A file with unknown keys is rejected.

[default]
mode = "draft"              # read | draft | send (capped by the mode the account logged in with)
# Appended to every body the agent writes. Omit for the built-in signoff; "" disables.
signoff = "\n\n-- \nSent by James's assistant (automated)"

[send]                      # checked by `email send` (mode = "send") on the draft's current recipients
allowed_recipient_domains = ["tronai.com.au"]   # every recipient must be in these; empty = no restriction on send
                                                # (for block_external_forward, empty = the mailbox's own domain)
max_recipients = 5          # to + cc + bcc; 0 = unlimited
block_external_forward = true                   # also applies to `draft forward`
require_reply_context = true                    # send only replies/forwards, never a brand-new message

[delete]
enabled = false             # blocks move/label to trash and DELETE via `email api`

[watch]                     # filters for `email watch` notifications (not for sync or list)
# Case-insensitive substrings of the sender address / subject; "@domain" works as a suffix.
ignore_senders = ["noreply@", "no-reply@", "notifications@"]
ignore_subjects = []
only_unread = true          # skip mail already read (e.g. on the phone) by the time watch sees it
