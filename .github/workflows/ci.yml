name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: build (linux/darwin x amd64/arm64)
        run: |
          for os in linux darwin; do for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/email
          done; done
      - name: goreleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # install.sh in clean containers, against the latest published release,
  # anonymously (no token), as a new user would.
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "alpine:3.20"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          if command -v apk >/dev/null; then apk add --no-cache curl ca-certificates
          else apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; fi
      - name: install.sh
        run: |
          sh install.sh --dest /tmp/bin
          /tmp/bin/email version
          sh install.sh --dest /tmp/bin 2>&1 | grep -q "already installed"
      - name: doctor (fake mailbox)
        env:
          EMAIL_CONFIG_DIR: /tmp/email/config
          EMAIL_STATE_DIR: /tmp/email/state
        run: |
          /tmp/bin/email auth login -a demo --provider fake --mode draft -q
          cp docs/policy/draft.toml /tmp/email/config/policy.toml
          /tmp/bin/email doctor --no-update-check --format text

  # The Helm chart: lint, then a real install in kind with a stand-in Hermes
  # (charts/hermes-email/ci/e2e.sh), using an image built from this commit.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - name: lint
        run: |
          helm lint charts/hermes-email --strict --set hermes.pvc=data --set hermes.webhookURL=http://hermes:8644/webhooks/email
          helm lint charts/hermes-email --strict -f charts/hermes-email/examples/values.yaml
          helm template x charts/hermes-email -f charts/hermes-email/examples/values.yaml >/dev/null
          ! helm template x charts/hermes-email 2>/dev/null   # hermes.pvc and webhookURL are required
      - name: image
        run: |
          mkdir -p ctx/linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=ci" -o ctx/linux/amd64/email ./cmd/email
          cp Dockerfile LICENSE ctx/
          docker build -t email-cli:ci ctx
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: e2e
        run: |
          kind load docker-image email-cli:ci --name ci
          sh charts/hermes-email/ci/e2e.sh
