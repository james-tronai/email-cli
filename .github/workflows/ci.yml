name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: build (linux/darwin x amd64/arm64)
        run: |
          for os in linux darwin; do for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/email
          done; done
      - name: goreleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # install.sh in clean containers, against the latest published release.
  # The repository is private for now, so the token path (curl) is tested;
  # once it is public, drop GITHUB_TOKEN to test the anonymous path.
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "alpine:3.20"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          if command -v apk >/dev/null; then apk add --no-cache curl ca-certificates
          else apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; fi
      - name: install.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sh install.sh --dest /tmp/bin
          /tmp/bin/email version
          sh install.sh --dest /tmp/bin 2>&1 | grep -q "already installed"
      - name: doctor (fake mailbox)
        env:
          EMAIL_CONFIG_DIR: /tmp/email/config
          EMAIL_STATE_DIR: /tmp/email/state
        run: |
          /tmp/bin/email auth login -a demo --provider fake --mode draft -q
          cp docs/policy/draft.toml /tmp/email/config/policy.toml
          /tmp/bin/email doctor --no-update-check --format text
