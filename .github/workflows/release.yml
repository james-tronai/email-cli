name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # create the release and upload assets (GITHUB_TOKEN is enough)
  packages: write # push ghcr.io/james-tronai/email-cli and the chart (ghcr.io/james-tronai/charts/hermes-email)
  id-token: write # keyless cosign signatures (Sigstore, GitHub OIDC)
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test -race -count=1 ./...
      # The chart is released with the binary: version and appVersion must be the tag.
      - name: chart version
        run: |
          v="$(awk '$1 == "version:" {print $2}' charts/hermes-email/Chart.yaml)"
          a="$(awk '$1 == "appVersion:" {print $2}' charts/hermes-email/Chart.yaml)"
          if [ "v$v" != "$GITHUB_REF_NAME" ] || [ "$a" != "$GITHUB_REF_NAME" ]; then
            echo "charts/hermes-email/Chart.yaml has version $v, appVersion $a; the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      # Release notes are written by hand, because they must say what the
      # deployment has to change. Without the file the release gets a
      # one-line pointer to the commits.
      - name: release notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            printf 'Commits: https://github.com/%s/commits/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
            notes="$RUNNER_TEMP/notes.md"
          fi
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ env.NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: write access to james-tronai/homebrew-tap. Unset, the
          # cask is not pushed.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: smoke-test the image
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          docker run --rm "$img" version
          # TLS from FROM scratch (embedded fallback roots): a certificate
          # error would show in check_error.
          docker run --rm "$img" version --check | tee "$RUNNER_TEMP/check.json"
          ! grep -qiE "x509|certificate" "$RUNNER_TEMP/check.json"
          # The initContainer path: copy the binary out of the scratch image.
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm --user "$(id -u)" -v "$RUNNER_TEMP/out:/out" "$img" self-install --dest /out
          "$RUNNER_TEMP/out/email" version | grep -q "\"version\": \"${GITHUB_REF_NAME}\""
      - uses: azure/setup-helm@v4
      # The chart as an OCI artifact (signed like the image) and as a release asset.
      - name: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/hermes-email -d "$RUNNER_TEMP/chart"
          tgz="$(ls "$RUNNER_TEMP"/chart/hermes-email-*.tgz)"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "$tgz" oci://ghcr.io/james-tronai/charts 2>&1 | tee "$RUNNER_TEMP/push.txt"
          digest="$(awk '/^Digest:/ {print $2}' "$RUNNER_TEMP/push.txt")"
          cosign sign --yes "ghcr.io/james-tronai/charts/hermes-email@$digest"
          gh release upload "$GITHUB_REF_NAME" "$tgz"
